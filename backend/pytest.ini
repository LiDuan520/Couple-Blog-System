[pytest]
# pytest 配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步支持
asyncio_mode = auto

# 输出选项
addopts = -v --tb=short --strict-markers

# 自定义标记
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢测试

# 避免覆盖真实数据库
env_files =
    .env.test
